<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070f">
<title>StreamHub · Admin</title>
<style>
  :root{--bg:#05070f;--card:#0c1220;--line:#1b2540;--txt:#e9eef9;--dim:#8994ad;--acc:#3d7bff;--ok:#17b26a;--err:#e5484d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 60px}
  .wrap{max-width:900px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
  h1{font-size:19px;margin:0;letter-spacing:-.3px}
  h1 small{display:block;font-size:11px;font-weight:400;color:var(--dim);letter-spacing:0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:26px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card + .card{margin-top:12px}
  label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  input,select,textarea{width:100%;background:#070c16;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px 12px;font:inherit}
  textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  button{border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500;padding:8px 12px;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:130px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:#070c16;border:1px solid var(--line);border-radius:11px;padding:13px}
  .stat b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.5px}
  .stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600}
  td{color:#c8d2e6;word-break:break-all}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.ok{background:#0d2f21;color:var(--ok)}
  .pill.err{background:#331216;color:var(--err)}
  .pill.wait{background:#2a2410;color:#d8a531}
  .checks{display:flex;gap:6px;flex-wrap:wrap}
  .chk{font-size:11px;padding:3px 9px;border-radius:20px;background:#0d2f21;color:var(--ok);border:1px solid #17452f}
  .chk.bad{background:#331216;color:var(--err);border-color:#4a1c20}
  .muted{color:var(--dim);font-size:12.5px}
  .msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:9px;background:#331216;color:#ff9ea1;display:none}
  .msg.show{display:block}
  .empty{padding:18px 4px;color:var(--dim);font-size:13px}
  [hidden]{display:none !important}
  .del{background:transparent;border:1px solid #4a1c20;color:var(--err);padding:4px 9px;font-size:11.5px;border-radius:7px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>StreamHub <small>Panel de administración</small></h1>
    <button id="out" class="ghost" hidden>Salir</button>
  </header>

  <div id="loginBox" class="card">
    <label for="pw">Contraseña de administración</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="row" style="margin-top:12px">
      <button id="go">Entrar</button>
    </div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="panel" hidden>

    <h2>Estado del sistema</h2>
    <div class="card">
      <div id="checks" class="checks"><span class="muted">Comprobando…</span></div>
      <div class="msg" id="checkMsg"></div>
    </div>

    <h2>Resumen</h2>
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="sCookies">–</b><span>Cookies</span></div>
        <div class="stat"><b id="sAct">–</b><span>Activaciones</span></div>
        <div class="stat"><b id="sOk">–</b><span>Exitosas</span></div>
        <div class="stat"><b id="sErr">–</b><span>Fallidas</span></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button id="reload" class="ghost">Actualizar</button>
      </div>
      <div class="msg" id="statsMsg"></div>
    </div>

    <h2>Cookies</h2>
    <div class="card">
      <label for="plat">Plataforma</label>
      <select id="plat"></select>
      <label for="raw" style="margin-top:12px">Contenido de la cookie</label>
      <textarea id="raw" placeholder='[{"name":"NetflixId","value":"..."}]  ·  o formato Netscape  ·  o name=value; name2=value2'></textarea>
      <div class="row" style="margin-top:12px">
        <button id="save">Guardar cookie</button>
        <button id="listBtn" class="ghost">Ver guardadas</button>
      </div>
      <div class="msg" id="ckMsg"></div>
      <div id="ckList" style="margin-top:14px"></div>
    </div>

    <h2>Prueba de activación</h2>
    <div class="card">
      <label for="tplat">Plataforma</label>
      <select id="tplat"></select>
      <label for="tcode" style="margin-top:12px">Código de la TV</label>
      <input id="tcode" inputmode="numeric" placeholder="Código que muestra la pantalla">
      <div class="row" style="margin-top:12px">
        <button id="test">Probar</button>
      </div>
      <div class="msg" id="tMsg"></div>
      <div id="tLog" style="margin-top:12px"></div>
    </div>

    <h2>Últimas activaciones</h2>
    <div class="card">
      <button id="logsBtn" class="ghost">Cargar registros</button>
      <div class="msg" id="logMsg"></div>
      <div id="logs" style="margin-top:14px"></div>
    </div>

  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
